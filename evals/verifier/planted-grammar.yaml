# Planted-error set for choosing the lesson checker (specs/grammar-lessons, option 2, 17 Nov 2026).
# Written by the agent. Every `wrong` entry has exactly one planted error of the kind a generator makes; every
# `right` entry is standard British/American English grammar. A checker should flag the wrong ones and pass the
# right ones. Small on purpose (40): it ranks candidates, it does not certify one.
claims:
  - {id: c01, truth: right, text: "Use the present perfect with 'since' for a situation that started in the past and continues now: I have lived here since 2019."}
  - {id: c02, truth: wrong, text: "Use the past simple with 'since' for a situation that continues now: I lived here since 2019."}
  - {id: c03, truth: right, text: "'Ago' goes with the past simple: She left two hours ago."}
  - {id: c04, truth: wrong, text: "'Ago' goes with the present perfect: She has left two hours ago."}
  - {id: c05, truth: right, text: "The third person singular of the present simple adds -s or -es: He watches TV every night."}
  - {id: c06, truth: wrong, text: "In the present simple, 'does' is followed by a verb with -s in questions: Does she likes coffee?"}
  - {id: c07, truth: right, text: "Use 'an' before a vowel sound, so we say 'an hour' and 'a university'."}
  - {id: c08, truth: wrong, text: "Use 'an' before any word spelled with a vowel letter, so we say 'an university'."}
  - {id: c09, truth: right, text: "Uncountable nouns such as 'information' and 'advice' have no plural form: some useful information."}
  - {id: c10, truth: wrong, text: "'Information' is countable, so we say 'many informations'."}
  - {id: c11, truth: right, text: "The second conditional uses 'if' + past simple and 'would' + base verb: If I had more time, I would travel."}
  - {id: c12, truth: wrong, text: "The second conditional uses 'if' + 'would': If I would have more time, I would travel."}
  - {id: c13, truth: right, text: "The third conditional uses 'if' + past perfect and 'would have' + past participle: If she had studied, she would have passed."}
  - {id: c14, truth: wrong, text: "The third conditional uses 'if' + past simple and 'would' + base verb: If she studied, she would pass yesterday."}
  - {id: c15, truth: right, text: "The passive is formed with 'be' + past participle: The bridge was built in 1990."}
  - {id: c16, truth: wrong, text: "The passive is formed with 'be' + base verb: The bridge was build in 1990."}
  - {id: c17, truth: right, text: "After 'enjoy' and 'avoid', use the -ing form: I enjoy reading."}
  - {id: c18, truth: wrong, text: "After 'enjoy', use 'to' + base verb: I enjoy to read."}
  - {id: c19, truth: right, text: "A non-defining relative clause is separated by commas and cannot use 'that': My brother, who lives in Hue, is a doctor."}
  - {id: c20, truth: wrong, text: "A non-defining relative clause uses 'that' after a comma: My brother, that lives in Hue, is a doctor."}
