# Agreed deployment: DeepSeek generation, independent Gemini verification.
# Model IDs still require account configuration and P1's quality evaluation.
tiers:
  free:
    graph: &free
      - {provider: deepseek, model: '${DEEPSEEK_FREE_MODEL}', family: deepseek}
    items: *free
    tutor: *free
    ask: *free
    # Writing (specs/writing/step-2.4.md): explanations and minimal corrections, checked by code.
    writing_feedback: *free
    writing_correct: *free
    writing_rewrite: *free
    # Step 2.11b: the essay's structure described with quotes, then checked by code.
    writing_structure: *free
    # The vocabulary import (specs/vocabulary-import): entries checked by code, marked draft.
    vocab_import: *free
    # Reading questions from open texts (specs/listening-reading/step-4.2b.md), checked by code and blind.
    reading_items: *free
    # A Reading test the learner took elsewhere (specs/listening-reading/step-4.3d.md): the questions
    # read into a list, and each wrong answer explained; both checked by code, owner only for now.
    reading_own_parse: *free
    reading_own_explain: *free
    verify: &verify
      - {provider: gemini, model: '${GEMINI_VERIFY_MODEL}', family: gemini}
      - {provider: vertex, model: '${VERTEX_VERIFY_MODEL}', family: gemini}
    # The lesson checker (specs/grammar-lessons): free OpenRouter models, chosen by the planted-error
    # test (evals/baselines/verifier-pick-*.json); dots is the backup if Ernie fails or is withdrawn.
    # Only for public lesson text. With credit, put a paid model first here.
    lesson_check: &lesson_check
      - {provider: openrouter, model: 'baidu/ernie-5.5-flash-preview:free', family: ernie}
      - {provider: openrouter, model: 'dots-studio/dots-3-note-preview:free', family: dots}
    # Reading questions, checked blind from the passage only (step 4.2b); same free models, same reason.
    reading_check: *lesson_check
  pro:
    graph: &graph
      - {provider: deepseek, model: '${DEEPSEEK_PRO_MODEL}', family: deepseek}
    research: *graph
    items: *graph
    verify: *verify
    lesson_check: *lesson_check
    reading_check: *lesson_check
    reading_items: *graph
    tutor: &pro
      - {provider: deepseek, model: '${DEEPSEEK_PRO_MODEL}', family: deepseek}
    ask: *pro
