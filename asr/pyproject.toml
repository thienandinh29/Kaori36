[project]
name = "nodetrail-asr"
version = "0.1.0"
description = "Speech recognition for the Speaking test: Whisper small.en through faster-whisper (specs/speaking/step-5.1.md)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "faster-whisper>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

# The service runs only in its Linux container (also on Windows and macOS hosts, through Docker).
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
