# Open sources considered for the English course (specs/english-course). Candidates only: nothing here is fetched.
# Licences below are what we BELIEVE until someone reads each on the source's own page and sets status. `checked_by`
# says who read it: the owner, or the agent at the owner's request (17 Nov 2026, the grammar sources):
#   to_check  -> not read yet
#   verified  -> licence read on its own page: add checked_on (YYYY-MM-DD) and licence_page (URL)
#   rejected  -> add reason (e.g. NoDerivatives, no clear licence)
# Rules (checked by code): NoDerivatives is never allowed; NonCommercial is allowed for study and flagged.
candidates:
  - slug: ngsl
    name: New General Service List (NGSL)
    url: https://www.newgeneralservicelist.com/
    use: core general vocabulary (about 2,800 words), the A1-B1 word set
    believed_licence: CC BY-SA 4.0
    status: verified
    licence: CC BY-SA 4.0
    checked_on: 2026-11-16
    licence_page: https://www.newgeneralservicelist.com/new-general-service-list
    # Read by the owner on the list's own page: "NGSL 1.2 by Browne, C., Culligan, B., and Phillips, J. is licensed
    # under a Creative Commons Attribution-ShareAlike 4.0 International License". The site also offers the list
    # with definitions in easy English (same page). Official site: .com only (the .org domain is not theirs).
  - slug: nawl
    name: New Academic Word List (NAWL)
    url: https://www.newgeneralservicelist.com/new-academic-word-list
    use: academic vocabulary for IELTS (about 960 words), B2-C1
    believed_licence: CC BY-SA 4.0
    status: verified
    licence: CC BY-SA 4.0
    checked_on: 2026-11-16
    licence_page: https://www.newgeneralservicelist.com/new-academic-word-list
    # Read by the owner on the list's own page: "NAWL 1.2 by Browne, C., Culligan, B., and Phillips, J. is licensed
    # under a Creative Commons Attribution-ShareAlike 4.0 International License". The site also offers the list
    # with definitions in easy English (same page). Official site: .com only (the .org domain is not theirs).
  - slug: tsl
    name: TOEIC Service List (TSL)
    url: https://www.newgeneralservicelist.com/toeic-service-list
    use: everyday service and office English (about 1,250 words); about 1,020 not already in NGSL/NAWL
    believed_licence: CC BY-SA 4.0
    status: verified
    licence: CC BY-SA 4.0
    checked_on: 2026-11-27
    checked_by: agent
    licence_page: https://www.newgeneralservicelist.com/toeic-service-list
    # Read by the agent at the owner's request on the list's own page: "TOEIC Service List by Browne, C. and Culligan, B.,
    # is licensed under a Creative Commons Attribution-ShareAlike 4.0 International License". Version 1.2, with easy-English
    # definitions (TSL_12_definitions.xlsx). Imported by specs/vocabulary-import/step-tsl-bsl.md.
  - slug: bsl
    name: Business Service List (BSL)
    url: https://www.newgeneralservicelist.com/business-service-list
    use: general business English (about 1,750 words); about 1,240 not already in NGSL/NAWL
    believed_licence: CC BY-SA 4.0
    status: verified
    licence: CC BY-SA 4.0
    checked_on: 2026-11-27
    checked_by: agent
    licence_page: https://www.newgeneralservicelist.com/business-service-list
    # Read by the agent at the owner's request on the list's own page: "Business Service List by Browne, C. and Culligan,
    # B., is licensed under a Creative Commons Attribution-ShareAlike 4.0 International License". Version 1.20; no
    # definitions file: the model writes them, blind-checked (specs/vocabulary-import/step-tsl-bsl.md).
  - slug: wiktionary
    name: English Wiktionary
    url: https://en.wiktionary.org/
    use: definitions, word forms, example sentences, IPA
    believed_licence: CC BY-SA 4.0
    status: verified
    licence: CC BY-SA 4.0
    checked_on: 2026-11-26
    licence_page: https://en.wiktionary.org/wiki/Wiktionary:Copyrights
    # Read by the owner on Wiktionary's own pages: the text is dual-licensed under CC BY-SA 4.0 (and the GFDL); we use
    # it under CC BY-SA 4.0, so adapted data goes in data-sa/. Read through the wiktextract dump on kaikki.org
    # (cite Ylonen, LREC 2022). Recordings on Wikimedia Commons are NOT covered: each file has its own licence.
  - slug: tatoeba
    name: Tatoeba sentences
    url: https://tatoeba.org/en/downloads
    use: example sentences, many with Vietnamese translations, for vocabulary cards
    believed_licence: CC BY 2.0 FR (some sentences CC0)
    status: to_check
  - slug: simple-wikipedia
    name: Simple English Wikipedia
    url: https://simple.wikipedia.org/
    use: reading texts for lower levels
    believed_licence: CC BY-SA 4.0
    status: to_check
  - slug: openstax-reading
    name: OpenStax textbooks as B2-C1 reading passages (Introduction to Sociology 3e, Astronomy 2e, World History vol. 1)
    url: https://openstax.org/
    use: academic reading texts, B2-C1 (specs/listening-reading/plan.md, CP1)
    believed_licence: CC BY-NC-SA 4.0
    status: verified
    licence: CC BY-NC-SA 4.0
    checked_on: 2026-11-19
    licence_page: https://openstax.org/details/books/introduction-sociology-3e
    checked_by: owner
    note: >-
      The owner read the licence on each book's openstax.org page on 19 Nov (introduction-sociology-3e, astronomy-2e,
      world-history-volume-1): all three CC BY-NC-SA 4.0. NonCommercial: study use only, flagged.
    # Each book's own collection metadata (GitHub openstax/osbooks-*, read 18 Nov by the agent) says "Creative Commons
    # Attribution-NonCommercial-ShareAlike 4.0 International". The owner reads the licence on each book's openstax.org
    # page before marking this verified. NonCommercial: allowed for study and flagged; ShareAlike: the bank shares alike.
  - slug: wikibooks-grammar
    name: Wikibooks, English Grammar
    url: https://en.wikibooks.org/wiki/English_Grammar
    use: grammar explanations to cite
    believed_licence: CC BY-SA 4.0
    status: verified
    licence: CC BY-SA 4.0
    checked_on: 2026-11-17
    licence_page: https://en.wikibooks.org/wiki/English_Grammar
    checked_by: agent
    note: >-
      A school grammar for native speakers (parts of speech, sentences, phrases and clauses), modelled on Warriner's
      layout and marked "partly developed". It has no lessons on tenses, articles or conditionals, so it does not fill
      the A1-B1 gap; usable only for terms (noun, clause, gerund).
  - slug: esl-grammar-bissonnette
    name: ESL Grammar The Way You Like It (Don Bissonnette, South Seattle College; LibreTexts)
    url: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/ESL_Grammar_The_Way_You_Like_It_(Bissonnette)
    use: grammar lessons across the whole path, read through RAG
    believed_licence: CC BY-NC 4.0
    status: verified
    licence: CC BY-NC 4.0
    checked_on: 2026-11-17
    licence_page: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/ESL_Grammar_The_Way_You_Like_It_(Bissonnette)
    checked_by: agent
    note: >-
      Five books, A1 to C1. Book 1: be, present simple and continuous, adverbs of frequency, past simple and
      continuous, irregular verbs. Book 2: modals, comparatives, prepositions, questions, spelling of -s and -ed.
      Book 3: perfect tenses, simple vs perfect, gerunds and infinitives. Book 4: passive, relative clauses,
      conditionals, linking words. Book 5: hypothetical conditionals, noun clauses, reported speech, causatives,
      subjunctive. NonCommercial: tag every chunk.
  - slug: al-haider-high-intermediate-grammar
    name: High-Intermediate Academic Grammar for ESL Students (Rebecca Al Haider, Reedley College; LibreTexts)
    url: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/High-Intermediate_Academic_Grammar_for_ESL_Students_(Al_Haider)
    use: grammar lessons for B1-B2 nodes, read through RAG
    believed_licence: CC BY 4.0
    status: verified
    licence: CC BY 4.0
    checked_on: 2026-11-17
    licence_page: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/High-Intermediate_Academic_Grammar_for_ESL_Students_(Al_Haider)
    checked_by: agent
    note: >-
      Taught through topics (psychology, American history, lifespan); one grammar presentation per chapter: present
      simple, past simple and present perfect; gerunds and infinitives; phrasal verbs; adjective clauses; modals;
      passive; reported speech; embedded questions; simple future. Only the author's text is used: the linked
      listening videos are other people's.
  - slug: al-haider-academic-grammar
    name: Advanced Academic Grammar for ESL Students (Rebecca Al Haider, Reedley College)
    url: https://open.umn.edu/opentextbooks/textbooks/1074
    use: grammar for B2-C1 nodes
    believed_licence: CC BY 4.0
    status: to_check
    note: >-
      The Open Textbook Library record says CC BY 4.0, but the book itself is in a Google Drive folder that this
      session cannot open, so the book's own licence page has not been read. Taught through topics (ocean currents,
      street art, GMOs).
  - slug: explorations-1
    name: "Explorations 1: Grammar for the Experienced Beginner (Open Oregon; LibreTexts copy)"
    url: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/Explorations_1%3A_Grammar_for_the_Experienced_Beginner
    use: grammar lessons for the first A1 nodes, read through RAG
    believed_licence: CC BY-NC-SA 4.0
    status: verified
    licence: CC BY-NC-SA 4.0
    checked_on: 2026-11-17
    licence_page: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/Explorations_1%3A_Grammar_for_the_Experienced_Beginner
    checked_by: agent
    note: >-
      Read on the LibreTexts copy (the Open Oregon site refused this session). Four chapters only: be in the present,
      present continuous, present simple, the two compared. NonCommercial and ShareAlike: tag every chunk.
  - slug: haisley-concise-grammar
    name: A Concise Guide to English Grammar (Phillip Haisley, 2026)
    url: https://phil-a-sophist.github.io/concise-guide-english-grammar/front-colophon.html
    use: reference for grammar terms only
    believed_licence: CC BY 4.0
    status: rejected
    reason: >-
      Licence confirmed CC BY 4.0 on its colophon (17 Nov 2026), but it is a university linguistics textbook
      (linguistics, prescriptive vs descriptive grammar, morphology, word classes, sentence diagrams), not an ESL
      grammar; not a lesson source. Kept as a backup for terms.
  - slug: grammar-slides-ferguson
    name: Grammar Slides for English Learners (Sara Ferguson; LibreTexts)
    url: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/Grammar_Slides_for_English_Learners_(Ferguson)
    use: grammar presentations
    believed_licence: none stated
    status: rejected
    reason: The LibreTexts page says "shared under a not declared license".
  - slug: college-esl-writers-hall-wallace
    name: "College ESL Writers: Applied Grammar and Composing Strategies for Success (Hall and Wallace; LibreTexts)"
    url: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/College_ESL_Writers_-_Applied_Grammar_and_Composing_Strategies_for_Success_(Hall_and_Wallace)
    use: grammar lessons for articles, count and noncount nouns, pronouns, negatives, agreement, read through RAG
    believed_licence: CC BY-NC-SA
    status: verified
    licence: CC BY-NC-SA
    checked_on: 2026-11-17
    licence_page: https://human.libretexts.org/Bookshelves/Languages/English_as_a_Second_Language/College_ESL_Writers_-_Applied_Grammar_and_Composing_Strategies_for_Success_(Hall_and_Wallace)/07%3A_Overview_of_English_Grammar/7.04%3A_Count_and_Noncount_Nouns_and_Articles
    checked_by: agent
    note: >-
      The LibreTexts pages say "CC BY-NC-SA" without a version (GALILEO Open Learning Materials). Chapter 7 covers
      7.03 negative statements, 7.04 count and noncount nouns and articles, 7.05 pronouns, 7.06 pronoun agreement,
      7.08 verb tenses, 7.09 modals, 7.10 subject-verb agreement, 7.11 prepositions; chapter 2 covers coordination
      and subordination. Written for college ESL writers (B1-B2). NonCommercial and ShareAlike: tag every chunk.
  - slug: beginning-esol-dodson
    name: A Digital Workbook for Beginning ESOL (Dodson, Jordan, Krause; Portland Community College, Open Oregon)
    url: https://openoregon.pressbooks.pub/esol23/
    use: A1-B1 grammar, including articles (indefinite and definite), the one CC BY candidate for beginners
    believed_licence: CC BY 4.0
    status: verified
    licence: CC BY 4.0
    checked_on: 2026-11-17
    licence_page: https://openoregon.pressbooks.pub/esol23/
    checked_by: owner
    note: >-
      Read by the owner on the book's page: "A Digital Workbook for Beginning ESOL Copyright 2018 by Eric Dodson,
