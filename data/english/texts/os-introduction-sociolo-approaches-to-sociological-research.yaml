text: 'When sociologists apply the sociological perspective and begin to ask questions, no topic is off
  limits. Every aspect of human behavior is a source of possible investigation. Sociologists question
  the world that humans have created and live in. They notice patterns of behavior as people move through
  that world. Using sociological methods and systematic research within the framework of the scientific
  method and a scholarly interpretive perspective, sociologists have discovered social patterns in the
  workplace that have transformed industries, in families that have enlightened family members, and in
  education that have aided structural changes in classrooms.


  Sociologists often begin the research process by asking a question about how or why things happen in
  this world. It might be a unique question about a new trend or an old question about a common aspect
  of life. Once the question is formed, the sociologist proceeds through an in-depth process to answer
  it. In deciding how to design that process, the researcher may adopt a scientific approach or an interpretive
  framework. The following sections describe these approaches to knowledge.'
