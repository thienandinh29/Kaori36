text: 'Coded into the light and other kinds of radiation that reach us from objects in the universe is
  a wide range of information about what those objects are like and how they work. If we can decipher
  this code and read the messages it contains, we can learn an enormous amount about the cosmos without
  ever having to leave Earth or its immediate environment.


  The visible light and other radiation we receive from the stars and planets is generated by processes
  at the atomic level—by changes in the way the parts of an atom interact and move. Thus, to appreciate
  how light is generated, we must explore how atoms work. There is a bit of irony in the fact that in
  order to understand some of the largest structures in the universe, we must become acquainted with some
  of the smallest.


  Notice that we have twice used the phrase “light and other radiation.” One of the key ideas explored
  in this chapter is that visible light is not unique; it is merely the most familiar example of a much
  larger family of radiation that can carry information to us.


  The word “radiation” will be used frequently in this book, so it is important to understand what it
  means. In everyday language, “radiation” is often used to describe certain kinds of energetic subatomic
  particles released by radioactive materials in our environment. (An example is the kind of radiation
  used to treat some cancers.) But this is not what we mean when we use the word “radiation” in an astronomy
  text. Radiation, as used in this book, is a general term for waves (including light waves) that radiate
  outward from a source.


  As we saw in Orbits and Gravity, Newton’s theory of gravity accounts for the motions of planets as well
  as objects on Earth. Application of this theory to a variety of problems dominated the work of scientists
  for nearly two centuries. In the nineteenth century, many physicists turned to the study of electricity
  and magnetism, which are intimately connected with the production of light.


  The scientist who played a role in this field comparable to Newton’s role in the study of gravity was
  physicist James Clerk Maxwell, born and educated in Scotland. Inspired by a number of ingenious experiments
  that showed an intimate relationship between electricity and magnetism, Maxwell developed a theory that
  describes both electricity and magnetism with only a small number of elegant equations. It is this theory
  that gives us important insights into the nature and behavior of light.


  We will look at the structure of the atom in more detail later, but we begin by noting that the typical
  atom consists of several types of particles, a number of which have not only mass but an additional
  property called electric charge. In the nucleus (central part) of every atom are protons, which are
  positively charged; outside the nucleus are electrons, which have a negative charge.


  Maxwell’s theory deals with these electric charges and their effects, especially when they are moving.
  In the vicinity of an electron charge, another charge feels a force of attraction or repulsion: opposite
  charges attract; like charges repel. When charges are not in motion, we observe only this electric attraction
  or repulsion. If charges are in motion, however (as they are inside every atom and in a wire carrying
  a current), then we measure another force called magnetism.


  Magnetism was well known for much of recorded human history, but its cause was not understood until
  the nineteenth century. Experiments with electric charges demonstrated that magnetism was the result
  of moving charged particles. Sometimes, the motion is clear, as in the coils of heavy wire that make
  an industrial electromagnet. Other times, it is more subtle, as in the kind of magnet you buy in a hardware
  store, in which many of the electrons inside the atoms are spinning in roughly the same direction; it
  is the alignment of their motion that causes the material to become magnetic.


  Physicists use the word field to describe the action of forces that one object exerts on other distant
  objects. For example, we say the Sun produces a gravitational field that controls Earth’s orbit, even
  though the Sun and Earth do not come directly into contact. Using this terminology, we can say that
  stationary electric charges produce electric fields, and moving electric charges also produce magnetic
  fields.


  Actually, the relationship between electric and magnetic phenomena is even more profound. Experiments
  showed that changing magnetic fields could produce electric currents (and thus changing electric fields),
  and changing electric currents could in turn produce changing magnetic fields. So once begun, electric
  and magnetic field changes could continue to trigger each other.'
