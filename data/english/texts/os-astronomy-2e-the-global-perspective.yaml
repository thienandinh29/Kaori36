text: 'The interior of a planet—even our own Earth—is difficult to study, and its composition and structure
  must be determined indirectly. Our only direct experience is with the outermost skin of Earth^’s crust,
  a layer no more than a few kilometers deep. It is important to remember that, in many ways, we know
  less about our own planet 5 kilometers beneath our feet than we do about the surfaces of Venus and Mars.


  Earth is composed largely of metal and silicate rock (see the Composition and Structure of Planets section).
  Most of this material is in a solid state, but some of it is hot enough to be molten. The structure
  of material in Earth’s interior has been probed in considerable detail by measuring the transmission
  of seismic waves through Earth. These are waves that spread through the interior of Earth from earthquakes
  or explosion sites.


  Seismic waves travel through a planet rather like sound waves through a struck bell. Just as the sound
  frequencies vary depending on the material the bell is made of and how it is constructed, so a planet^’s
  response depends on its composition and structure. By monitoring the seismic waves in different locations,
  scientists can learn about the layers through which the waves have traveled. Some of these vibrations
  travel along the surface; others pass directly through the interior. Seismic studies have shown that
  Earth’s interior consists of several distinct layers with different compositions, illustrated in . As
  waves travel through different materials in Earth’s interior, the waves—just like light waves in telescope
  lenses—bend (or refract) so that some seismic stations on Earth receive the waves and others are in
  “shadows.” Detecting the waves in a network of seismographs helps scientists construct a model of Earth’s
  interior, showing liquid and solid layers. This type of seismic imaging is not unlike that used in ultrasound,
  a type of imaging used to see inside the body.


  The top layer is the crust, the part of Earth we know best. Oceanic crust covers 55% of Earth’s surface
  and lies mostly submerged under the oceans. It is typically about 6 kilometers thick and is composed
  of volcanic rocks called basalt. Produced by the cooling of volcanic lava, basalts are made primarily
  of the elements silicon, oxygen, iron, aluminum, and magnesium. The continental crust covers 45% of
  the surface, some of which is also beneath the oceans. The continental crust is 20 to 70 kilometers
  thick and is composed predominantly of a different volcanic class of silicates (rocks made of silicon
  and oxygen) called granite. These crustal rocks, both oceanic and continental, typically have densities
  of about 3 g/cm^3. (For comparison, the density of water is 1 g/cm^3.) The crust is the easiest layer
  for geologists to study, but it makes up only about 0.3% of the total mass of Earth.


  The largest part of the solid Earth, called the mantle, stretches from the base of the crust downward
  to a depth of 2900 kilometers. The mantle is more or less solid, but at the temperatures and pressures
  found there, mantle rock can deform and flow slowly. The density in the mantle increases downward from
  about 3.5 g/cm^3 to more than 5 g/cm^3 as a result of the compression produced by the weight of overlying
  material. Samples of upper mantle material are occasionally ejected from volcanoes, permitting a detailed
  analysis of its chemistry.


  Beginning at a depth of 2900 kilometers, we encounter the dense metallic core of Earth. With a diameter
  of 7000 kilometers, our core is substantially larger than the entire planet Mercury. The outer core
  is liquid, but the innermost part of the core (about 2400 kilometers in diameter) is probably solid.
  In addition to iron, the core probably also contains substantial quantities of nickel and sulfur, all
  compressed to a very high density.


  The separation of Earth into layers of different densities is an example of differentiation, the process
  of sorting the major components of a planet by density. The fact that Earth is differentiated suggests
  that it was once warm enough for its interior to melt, permitting the heavier metals to sink to the
  center and form the dense core. Evidence for differentiation comes from comparing the planet’s bulk
  density (5.5 g/cm^3) with the surface materials (3 g/cm^3) to suggest that denser material must be buried
  in the core.


  Earth is the prototype terrestrial planet. Its interior composition and structure are probed using seismic
  waves. Such studies reveal that Earth has a metal core and a silicate mantle. The outer layer, or crust,
  consists primarily of oceanic basalt and continental granite. A global magnetic field, generated in
  the core, produces Earth’s magnetosphere, which can trap charged atomic particles.'
