text: 'A reference group is a group that people compare themselves to—it provides a standard of measurement.
  In U.S. society, peer groups are common reference groups. Kids and adults pay attention to what their
  peers wear, what music they like, what they do with their free time—and they compare themselves to what
  they see. Most people have more than one reference group, so a middle school boy might look not just
  at his classmates but also at his older brother’s friends and see a different set of norms. And he might
  observe the behaviors of his favorite athletes for yet another point of reference.


  Some other examples of reference groups can be one’s cultural center, workplace, family gathering, and
  even parents. Often, reference groups convey competing messages. For instance, on television and in
  movies, young adults often have wonderful apartments and cars and lively social lives despite not holding
  a job. In music videos, young women might dance and sing in a sexually aggressive way that suggests
  experience beyond their years. At all ages, we use reference groups to help guide our behavior and establish
  our social norms. So how important is it to surround yourself with positive reference groups? You may
  not recognize a reference group, but it still influences the way you act. Identifying your reference
  groups can help you understand the source of the social identities you aspire to or want to distance
  yourself from.


  For a student entering college, the sociological study of groups takes on an immediate and practical
  meaning. After all, when we arrive someplace new, most of us glance around to see how well we fit in
  or stand out in the ways we want. This is a natural response to a reference group, and on a large campus,
  there can be many competing groups. Say you are a strong athlete who wants to play intramural sports,
  and your favorite musicians are a local punk band. You may find yourself engaged with two very different
  reference groups.


  These reference groups can also become your in-groups or out-groups. For instance, different groups
  on campus might solicit you to join. Are there fraternities and sororities at your school? If so, chances
  are they will try to convince students—that is, students they deem worthy—to join them. And if you love
  playing soccer and want to play on a campus team, but you’re wearing shredded jeans, combat boots, and
  a local band T-shirt, you might have a hard time convincing the soccer team to give you a chance. While
  most campus groups refrain from insulting competing groups, there is a definite sense of an in-group
  versus an out-group. “Them?” a member might say. “They’re all right, but their parties are nowhere near
  as cool as ours.” Or, “Only serious engineering geeks join that group.” This immediate categorization
  into in-groups and out-groups means that students must choose carefully, since whatever group they associate
  with might define their friends for several years to come.


  Groups largely define how we think of ourselves. There are two main types of groups: primary and secondary.
  As the names suggest, the primary group is the long-term, complex one. People use groups as standards
  of comparison to define themselves—both who they are and who they are not. Sometimes groups can be used
  to exclude people or as a tool that strengthens prejudice.


