text: 'The first, and perhaps most crucial, elements of culture we will discuss are values and beliefs.
  Value does not mean monetary worth in sociology, but rather ideals, or principles and standards members
  of a culture hold in high regard. Most cultures in any society hold “knowledge” (education) in high
  regard. Values are deeply embedded and are critical for learning a culture’s beliefs, which are the
  tenets or convictions that people hold to be true. Individual cultures in a society have personal beliefs,
  but they also shared collective values. To illustrate the difference, U.S. citizens may believe in the
  American Dream—that anyone who works hard enough will be successful and wealthy. Underlying this belief
  is the American value that wealth is important. In other cultures, success may be tied less to wealth
  and more to having many healthy children. Values shape a society by suggesting what is good and bad,
  beautiful and ugly, sought or avoided.


  Consider the value that the U.S. places upon youth. Children represent innocence and purity, while a
  youthful adult appearance signifies sexuality. Shaped by this value, individuals spend millions of dollars
  each year on cosmetic products and surgeries to look young and beautiful. The U.S. also has an individualistic
  culture, meaning people place a high value on individuality and independence. In contrast, many other
  cultures are collectivist, meaning the welfare of the group takes priority over that of the individual.
  Fulfilling a society’s values can be difficult. Marital monogamy is valued, but many spouses engage
  in infidelity. Cultural diversity and equal opportunities for all people are valued in the U.S., yet
  the country’s highest political offices have been dominated by white men.


  Values often suggest how people should behave, but they don’t accurately reflect how people do behave.
  Values portray an ideal culture, the standards society would like to embrace and live up to. But ideal
  culture differs from real culture. In an ideal culture, there would be no traffic accidents, murders,
  poverty, or racial tension. But in real culture, police officers, lawmakers, educators, and social workers
  constantly strive to prevent or address these issues. American teenagers are encouraged to value celibacy.
  However, the number of unplanned pregnancies among teens reveals that the ideal alone is not enough
  to spare teenagers the potential consequences of having sex.


  One of the ways societies strive to maintain its values is through rewards and punishments. When people
  observe the norms of society and uphold its values, they are often rewarded. A boy who helps an elderly
  woman board a bus may receive a smile and a “thank you.” A business manager who raises profit margins
  may receive a quarterly bonus. People sanction unwanted or inappropriate behaviors by withholding support,
  approval, or permission, or by implementing sanctions. We may think of ‘sanction’ as a negative term,
  but sanctions are forms of social control, ways to encourage conformity to cultural norms or rules.
  Sometimes people conform to norms in anticipation or expectation of positive sanctions. Receiving good
  grades, for instance, may mean praise from parents and teachers. Sanctions can also be negative. . A
  boy who shoves an elderly woman aside to board the bus first may receive frowns or even a scolding from
  other passengers. A business manager who drives away customers will likely be fired. Breaking norms
  and rejecting values can lead to cultural sanctions such as earning a negative label like ‘lazy’ or
  to legal sanctions, such as traffic tickets, fines, or imprisonment. Utilizing social control encourages
  most people to conform regardless of whether authority figures (such as law enforcement) are present.'
