text: 'In order to create an accurate map, a mapmaker needs a way to uniquely and simply identify the
  location of all the major features on the map, such as cities or natural landmarks. Similarly, astronomical
  mapmakers need a way to uniquely and simply identify the location of stars, galaxies, and other celestial
  objects. On Earth maps, we divide the surface of Earth into a grid, and each location on that grid can
  easily be found using its latitude and longitude coordinate. Astronomers have a similar system for objects
  on the sky. Learning about these can help us understand the apparent motion of objects in the sky from
  various places on Earth.


  Let’s begin by fixing our position on the surface of planet Earth. As we discussed in Observing the
  Sky: The Birth of Astronomy, Earth’s axis of rotation defines the locations of its North and South Poles
  and of its equator, halfway between. Two other directions are also defined by Earth’s motions: east
  is the direction toward which Earth rotates, and west is its opposite. At almost any point on Earth,
  the four directions—north, south, east, and west—are well defined, despite the fact that our planet
  is round rather than flat. The only exceptions are exactly at the North and South Poles, where the directions
  east and west are ambiguous (because points exactly at the poles do not turn).


  We can use these ideas to define a system of coordinates attached to our planet. Such a system, like
  the layout of streets and avenues in Manhattan or Salt Lake City, helps us find where we are or want
  to go. Coordinates on a sphere, however, are a little more complicated than those on a flat surface.
  We must define circles on the sphere that play the same role as the rectangular grid that you see on
  city maps.


  A great circle is any circle on the surface of a sphere whose center is at the center of the sphere.
  For example, Earth’s equator is a great circle on Earth’s surface, halfway between the North and South
  Poles. We can also imagine a series of great circles that pass through both the North and South Poles.
  Each of the circles is called a meridian; they are each perpendicular to the equator, crossing it at
  right angles.


  Any point on the surface of Earth will have a meridian passing through it. The meridian specifies the
  east-west location, or longitude, of the place. By international agreement (and it took many meetings
  for the world’s countries to agree), longitude is defined as the number of degrees of arc along the
  equator between your meridian and the one passing through Greenwich, England, which has been designated
  as the Prime Meridian. The longitude of the Prime Meridian is defined as 0°.


  Why Greenwich, you might ask? Every country wanted 0° longitude to pass through its own capital. Greenwich,
  the site of the old Royal Observatory, was selected because it was between continental Europe and the
  United States, and because it was the site for much of the development of the method to measure longitude
  at sea. Longitudes are measured either to the east or to the west of the Greenwich meridian from 0°
  to 180°. As an example, the longitude of the clock-house benchmark of the U.S. Naval Observatory in
  Washington, DC, is 77.066° W.


  Your latitude (or north-south location) is the number of degrees of arc you are away from the equator
  along your meridian. Latitudes are measured either north or south of the equator from 0° to 90°. (The
  latitude of the equator is 0°.) As an example, the latitude of the previously mentioned Naval Observatory
  benchmark is 38.921° N. The latitude of the South Pole is 90° S, and the latitude of the North Pole
  is 90° N.


  The terrestrial system of latitude and longitude makes use of the great circles called meridians. Longitude
  is arbitrarily set to 0° at the Royal Observatory at Greenwich, England. An analogous celestial coordinate
  system is called right ascension (RA) and declination, with 0° of declination starting at the vernal
  equinox. These coordinate systems help us locate any object on the celestial sphere. The Foucault pendulum
  is a way to demonstrate that Earth is turning.'
