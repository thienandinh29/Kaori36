text: 'Newton’s first law is sometimes called the law of inertia, where inertia is the tendency of objects
  (and legislatures) to keep doing what they are already doing. In other words, a stationary object stays
  put, and a moving object keeps moving unless some force intervenes.


  Let’s define the precise meaning of momentum—it depends on three factors: (1) speed—how fast a body
  moves (zero if it is stationary), (2) the direction of its motion, and (3) its mass—a measure of the
  amount of matter in a body, which we will discuss later. Scientists use the term velocity to describe
  the speed and direction of motion. For example, 20 kilometers per hour due south is velocity, whereas
  20 kilometers per hour just by itself is speed. Momentum then can be defined as an object’s mass times
  its velocity.


  It’s not so easy to see this rule in action in the everyday world because of the many forces acting
  on a body at any one time. One important force is friction, which generally slows things down. If you
  roll a ball along the sidewalk, it eventually comes to a stop because the sidewalk exerts a rubbing
  force on the ball. But in the space between the stars, where there is so little matter that friction
  is insignificant, objects can in fact continue to move (to coast) indefinitely.


  The momentum of a body can change only under the action of an outside influence. Newton’s second law
  expresses force in terms of its ability to change momentum with time. A force (a push or a pull) has
  both size and direction. When a force is applied to a body, the momentum changes in the direction of
  the applied force. This means that a force is required to change either the speed or the direction of
  a body, or both—that is, to start it moving, to speed it up, to slow it down, to stop it, or to change
  its direction.


  As you learned in Observing the Sky: The Birth of Astronomy, the rate of change in an object’s velocity
  is called acceleration. Newton showed that the acceleration of a body was proportional to the force
  being applied to it. Suppose that after a long period of reading, you push an astronomy book away from
  you on a long, smooth table. (We use a smooth table so we can ignore friction.) If you push the book
  steadily, it will continue to speed up as long as you are pushing it. The harder you push the book,
  the larger its acceleration will be. How much a force will accelerate an object is also determined by
  the object’s mass. If you kept pushing a pen with the same force with which you pushed the textbook,
  the pen—having less mass—would be accelerated to a greater speed.


  Newton’s third law is perhaps the most profound of the rules he discovered. Basically, it is a generalization
  of the first law, but it also gives us a way to define mass. If we consider a system of two or more
  objects isolated from outside influences, Newton’s first law says that the total momentum of the objects
  should remain constant. Therefore, any change of momentum within the system must be balanced by another
  change that is equal and opposite so that the momentum of the entire system is not changed.'
