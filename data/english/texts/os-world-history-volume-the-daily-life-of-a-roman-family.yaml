text: 'The family was an important element of life during the Roman Empire. The male patriarch was the
  head of the household, which consisted of the immediate and extended family, as well as adjacent groups,
  including dependents and enslaved people. While men held ultimate authority in the family, women were
  also expected to maintain family order, with responsibilities in and often outside the household. Pride
  in a family’s prosperity was a crucial Roman value, which motivated both the honoring of ancestors and
  the securing of a future for descendants. Romans looked to their ancestors for examples of correct moral
  behavior and worked diligently for the family’s continuing stability.


  Family life was oriented around the paterfamilias, the male head of the household. According to tradition,
  this patriarch had the power of life and death over all his dependents, an authority referred to as
  patria potestas (“paternal power”). Members of the extended family subject to this authority included
  the patriarch’s wife, their children, anyone descended through the family’s male line, and all enslaved
  people belonging to the household. With his authority, the patriarch was both the judge and rule maker
  of the family, with the power to sell his dependents into bondage or destroy their property.


  Ultimately, however, the goal of the paterfamilias was to promote his family’s welfare. His power worked
  through consensus and deliberation with the other family members. As the primary provider, he expected
  respect from his family but could also reward good behavior. In this way, an entire family might benefit
  by working together to further their social or financial prosperity.


  The securing of a Roman family’s reputation began with the education and training of children. In early
  Rome, children were educated in the home; later, grammar schools enrolled boys and girls from wealthy
  families until around the age of twelve. Education usually centered on reading and writing Latin and
  Greek as well as arithmetic. Around age fifteen, boys donned the toga virilis (“toga of manhood”), a
  plain white toga representing their enrollment as citizens and entrance into manhood. Roman citizenship
  was highly coveted and was bestowed either at birth to children of citizens or by special decree. Sons
  of prominent families could then go on to a civil or military career. After a son inherited his father’s
  property (as well as his debts), it became his responsibility to maintain the family’s reputation and
  prosperity.


  By contrast, girls commonly married at a young age, usually between fourteen and eighteen years old,
  and often to a much older man. Younger girls were viewed as more sexually pure and therefore easier
  to control. In the most common form of marriage, a wife brought a dowry that became her husband’s property.
  Thus, a woman from a wealthy background with a large dowry had some sway in making marriage arrangements.
  She also had the protection a powerful family could offer should her husband prove to be less than ideal.
  Lower-class women were more reliant on their husband’s status to enhance their own. In any case, marriage
  represented a woman’s coming under the legal control of her husband’s household.


  The vast legal and age imbalance between husband and wife was reflected in the cultural restrictions
  on Roman women. Yet, though a Roman man’s work was an important contributor to the family’s success,
  women devoted much of their efforts to the same goal. Women were responsible for the management of the
  household, which included ensuring provisions for the family, overseeing any enslaved people and other
  dependents, and looking after the children. Spinning wool was viewed as the activity of an ideal Roman
  woman, and many wives were expected to occupy themselves with this work. Despite these expectations,
  there is evidence that many women, particularly non-elite women, held professions outside the home,
  including in medicine, trade, and agriculture.


  Romans lived and worked in a variety of contexts across the empire. Most of our evidence of the practical
  elements of their daily lives comes from archaeological evidence uncovered at Pompeii. The remains of
  this once-bustling city (which was destroyed by a volcanic eruption in 79 CE) show us the occupations,
  architecture, and lifestyles of different social classes. In addition, though most of what we know is
  about wealthy estates, life in the countryside outside the city constituted another important part of
  imperial Roman society.'
