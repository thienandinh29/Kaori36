text: 'Geography played a vital part in shaping early human societies. Landscape, climate, wildlife, vegetation,
  and the availability of natural resources all helped influence what early societies looked like, whether
  they were nomadic units that kept animals and survived by hunting and foraging or settled communities
  that grew crops, tended herds or flocks, and built shelters. Such characteristics depended on factors
  like weather patterns and soil fertility, as well as the proximity of drinking water and toolmaking
  resources.


  Well-watered regions in Africa, such as the grassy plains of the savannas and the northern and southern
  fringes of the continent, have historically produced environments that foster settled human communities.
  Here abundant rain, adequate forestation, and a host of wildlife provided conditions that could support
  ever-growing populations over long periods of time. More arid regions, such as the narrow transitional
  belts separating the savannas from Africa’s deserts, experience less rain and have less fertile soil,
  producing land that cannot be successfully farmed. These areas lent themselves to nomadism and the herding
  of grazing animals to provide many of the necessities of life, from milk and meat for food to leather
  and fur for clothing and bones for toolmaking. Throughout most of human history, geography has been
  an important factor in human development. As a result, exploring Africa’s diverse geography opens a
  window into the development of the earliest human civilization on the continent.


  The variety of African climates directly influenced the evolution of human societies there. People adapted
  to these climates in many ways, developing techniques and technologies that both helped them survive
  and altered their surroundings. Understanding the connection between climate, geography, and humans
  opens the way to understanding Africa’s early history.


  Before the domestication of plants and animals, life in prehistoric Africa was characterized by the
  hunter-gatherer stage of human civilization. Hunter-gatherers survive by hunting prey and foraging for
  fruits and vegetables, or by exchanging game for crops grown by others. In some regions, such as Tanzania
  and Kenya in East Africa and Botswana in southern Africa, hunter-gatherers followed the seasonal migrations
  of large game animals, such as wildebeests and elephants. Hunter-gatherers do not plant crops or build
  permanent shelters but rather live nomadic lifestyles guided by the seasons, limited resource availability,
  conflict with other groups, or a combination of these factors. They must be highly mobile so their communities
  tend to be small, consisting of only several dozen interrelated people. Their mobility means that they
  often play an important role in connecting different regions and cultures and in transmitting goods
  and ideas across great distances.


  Hunting and gathering peoples of Africa have historically included the rainforest-dwelling Baka of Central
  Africa and the San people of the Kalahari Desert. The Baka, found today in Cameroon, Gabon, and northern
  Congo, eat wild roots, nuts, fruits, vegetables, a variety of insect species, fish, and wild game they
  hunt using bows, poison-tipped arrows, and traps. Baka villages are made up of small single-family huts
  of branches and leaves, built predominantly by women and usually dismantled after about a week so the
  Baka can follow the available food supply. Baka society has a well-defined structure. In addition to
  building the family hut, women also dam small streams to catch fish and carry material gathered while
  foraging with their husbands. Men hold a higher social status derived from the fact that they engage
  in the more hazardous task of hunting and trapping animals.


  Like that of many other African peoples, the Baka religion was and remains centered on a belief in animism—that
  is, it teaches that certain objects, places, and creatures have spirits. Those who can interpret what
  those spirits desire have positions of leadership. Animism is also polytheistic, meaning it has numerous
  gods, each of whom typically personifies a natural force such as rain, wind, or lightning. Given the
  impact of weather on survival, it is not surprising that trying to control the natural environment was
  a key factor in religious observance. Among the gods of the Baka are Kamba, the creator of all things,
  and Jengi, the spirit of the forest. The Baka live in and rely on the forest for their survival, so
  they view Jengi as a parental figure and, perhaps most importantly, the protector of the forest.


  Although ancient African religions were remarkably complex, and their rituals, practices, and beliefs
  varied greatly among the continent’s diverse populations, some commonalities can be identified in the
  pre-Judaic, pre-Christian, and pre-Islamic periods, including polytheism. Another typical feature of
  the pantheon of traditional African deities is a supreme being, like the Ngai of the Kikuyu, held to
  be the creator god from whom the universe originated. The supreme being was a distant deity who played
  no role in the ordinary affairs of Africans. Instead, management of the day-to-day fell to specialized
  secondary deities, such as Obatala, the Yoruba god of earth, and Makasa, the Baganda god of harvest
  and fertility. Other shared features of many ancient African religions include the worship of ancestors
  as protectors and guides and ceremonial practices to mark important life events, such as the Bantu Okuyi,
  a rite of passage celebrating the transition between youth and adolescence.'
