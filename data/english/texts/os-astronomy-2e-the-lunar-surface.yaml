text: 'If you look at the Moon through a telescope, you can see that it is covered by impact craters of
  all sizes. The most conspicuous of the Moon’s surface features—those that can be seen with the unaided
  eye and that make up the feature often called “the man in the Moon”—are vast splotches of darker lava
  flows.


  Centuries ago, early lunar observers thought that the Moon had continents and oceans and that it was
  a possible abode of life. They called the dark areas “seas” (maria in Latin, or mare in the singular,
  pronounced “mah ray”). Their names, Mare Nubium (Sea of Clouds), Mare Tranquillitatis (Sea of Tranquility),
  and so on, are still in use today. In contrast, the “land” areas between the seas are not named. Thousands
  of individual craters have been named, however, mostly for great scientists and philosophers. Among
  the most prominent craters are those named for Plato, Copernicus, Tycho, and Kepler.


  We know today that the resemblance of lunar features to terrestrial ones is superficial. Even when they
  look somewhat similar, the origins of lunar features such as craters and mountains are very different
  from their terrestrial counterparts. The Moon’s relative lack of internal activity, together with the
  absence of air and water, make most of its geological history unlike anything we know on Earth.


  To trace the detailed history of the Moon or of any planet, we must be able to estimate the ages of
  individual rocks. Once lunar samples were brought back by the Apollo astronauts, the radioactive dating
  techniques that had been developed for Earth were applied to them. The solidification ages of the samples
  ranged from about 3.3 to 4.4 billion years old, substantially older than most of the rocks on Earth.
  For comparison, as we saw in the chapter on Earth, Moon, and Sky, both Earth and the Moon were formed
  between 4.5 and 4.6 billion years ago.


  Most of the crust of the Moon (83%) consists of silicate rocks called anorthosites; these regions are
  known as the lunar highlands. They are made of relatively low-density rock that solidified on the cooling
  Moon like slag floating on the top of a smelter. Because they formed so early in lunar history (between
  4.1 and 4.4 billion years ago), the highlands are also extremely heavily cratered, bearing the scars
  of all those billions of years of impacts by interplanetary debris.


  Unlike the mountains on Earth, the Moon’s highlands do not have any sharp folds in their ranges. The
  highlands have low, rounded profiles that resemble the oldest, most eroded mountains on Earth. Because
  there is no atmosphere or water on the Moon, there has been no wind, water, or ice to carve them into
  cliffs and sharp peaks, the way we have seen them shaped on Earth. Their smooth features are attributed
  to gradual erosion, mostly due to impact cratering.


  The maria are much less cratered than the highlands, and cover just 17% of the lunar surface, mostly
  on the side of the Moon that faces Earth.


  Today, we know that the maria consist mostly of dark-colored basalt (volcanic lava) laid down in volcanic
  eruptions billions of years ago. Eventually, these lava flows partly filled the huge depressions called
  impact basins, which had been produced by collisions of large chunks of material with the Moon relatively
  early in its history. The basalt on the Moon is very similar in composition to the crust under the oceans
  of Earth or to the lavas erupted by many terrestrial volcanoes. The youngest of the lunar impact basins
  is Mare Orientale, shown in .


  Volcanic activity may have begun very early in the Moon’s history, although most evidence of the first
  half billion years is lost. What we do know is that the major mare volcanism, which involved the release
  of lava from hundreds of kilometers below the surface, ended about 3.3 billion years ago. After that,
  the Moon’s interior cooled, and volcanic activity was limited to a very few small areas. The primary
  forces altering the surface come from the outside, not the interior.


  The Moon, like Earth, was formed about 4.5 billion years ago. The Moon’s heavily cratered highlands
  are made of rocks more than 4 billion years old. The darker volcanic plains of the maria were erupted
  primarily between 3.3 and 3.8 billion years ago. Generally, the surface is dominated by impacts, including
  continuing small impacts that produce its fine-grained soil.'
