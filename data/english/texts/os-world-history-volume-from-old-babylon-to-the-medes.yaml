text: 'The many city-states, kingdoms, and empires of Mesopotamia operated in a complex world in which
  both risks and rewards for rulers were extremely high. War was especially common, and diplomatic mistakes
  could have costly consequences. Kings preferred to avoid war if possible and maintain healthy diplomatic
  relationships with others instead. A smaller kingdom, for example, might find it advantageous to seek
  an alliance with a large regional power like Assyria, Babylonia, or the Hittite Empire. Sending sons
  and daughters to rival kingdoms in marriage also helped forestall war and build cultural and familial
  bridges between competitors. The Hittite king Suppiluliumas attempted to marry one of his sons into
  the Egyptian royal family, which would have united these two regional powers and competitors. That marriage
  never took place, but many others did.


  Ambassadors were a key part of Mesopotamia’s complex diplomatic world. Kings frequently sent their representatives
  to friendly and even rival kingdoms to mend or strengthen relationships, a vital task frequently performed
  under extreme pressure. A wrong move could start a war. As they are today, however, such emissaries
  were guaranteed certain protections. In ordinary situations, they could expect to be free to leave unharmed
  when the situation demanded it, to be exempt from certain taxes, and to have their property respected.
  But if war broke out between the two kingdoms, an ambassador could get caught in the middle.


  Gift giving was an important part of the ambassadors’ role. When sent to another kingdom, emissaries
  frequently carried with them an offering of high value for the king who received them, and on their
  return home, their king expected a present of equal or greater worth. This exchange of gifts demonstrated
  respect and goodwill between the rulers. Returning empty-handed suggested the foreign king was breaking
  off diplomatic relations or had even become hostile. Occasionally an ambassador might be unable to return
  home, either because the relationship between the two kingdoms had gone sour or because the foreign
  king refused to supply an appropriate gift.


  Rulers did not rely only on ambassadors for collecting intelligence in Ancient Mesopotamia. They often
  employed spies to inform them of what was happening inside both rival and friendly foreign kingdoms.
  These could be merchants, sailors, artisans, or refugees fleeing foreign lands. Hammurabi, for example,
  made frequent use of espionage. Not only did he recruit agents of all types to keep tabs on other kings,
  but he even established a special intelligence bureau in the palace at Mari to collect, translate, and
  analyze documents provided by his many spies. The most common uses of this intelligence were to anticipate
  war, learn about troop movements, and assess the strength of a foreign kingdom before putting an army
  into the field. Using spies was risky, however, because the very nature of the work suggested that such
  agents were never to be trusted, and betrayal was always a possibility. An even greater risk was borne
  by the spies themselves, who could expect a painful death if caught.


  Long-distance trade was another important point of contact between different kingdoms around the region.
  Archaeological work has unearthed a wealth of information about the trading networks that crisscrossed
  the Near East and beyond. As early as the empire of Sargon of Akkad, Mesopotamian traders operating
  in the Persian Gulf sailed as far as modern-day Pakistan to trade with the people of the Indus River
  valley. Large empires had an interest in encouraging trade and maintained roads and bridges across the
  Near East for that purpose. The Assyrians were productive builders of roads and bridges that carried
  people and goods into and across their territory. Roads in the enormous Neo-Assyrian Empire were managed
  by a central government authority to ensure that the movement of goods and especially of soldiers proceeded
  unhindered.


  By today’s standards, the long-distance roads that crisscrossed this landscape were often of poor quality.
  They were generally unpaved and were maintained by local authorities, who would frequently carve a new
  road alongside the old one after years of wear. In the desert regions where soil was firm, the roads
  might be straight, while in more diverse terrain, they might wind around mountains and other imposing
  obstacles like swamps. Traveling between cities on such roads could take several weeks, even over relatively
  short distances. Traders could expect some form of protection from local rulers, however, in exchange
  for paying custom fees and duties.


  Access to foreign goods and raw materials was a major concern of empires in the Near East. In Mesopotamia
  in particular, vital resources like stone, timber, and metal ores were scarce, and they had to be procured
  in large quantities from distant locations. The flow of these goods into imperial centers often took
  the form of tribute payments, much like a tax, from vassal or subjugated kingdoms. However, tribute
  was not the only mechanism for international trade. During the Old Assyrian period (c. 2000–1600 BCE),
  for example, Assyrian traders traveled between Mesopotamia, Anatolia, and even Afghanistan trading in
  valuable goods like copper, tin, and textiles. Copper and tin were especially important because they
  are the ingredients needed to make bronze, the primary material for manufacturing metal tools and weapons
  in this period. The Assyrians even established merchant colonies in Anatolia where they exchanged tin
  and textiles for silver and gold.'
