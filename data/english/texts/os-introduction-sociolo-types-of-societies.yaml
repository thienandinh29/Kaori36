text: 'In sociological terms, society refers to a group of people who live in a definable community and
  share the same cultural components. On a broader scale, society consists of the people and institutions
  around us, our shared beliefs, and our cultural ideas. Typically, many societies also share a political
  authority.


  Consider China and the United States. Both are technologically advanced, have dense networks of transportation
  and communications, rely on foreign trading partners for large portions of their economies, focus on
  education as a way to advance their citizens, and have large and expensive militaries. Both countries
  have citizens that may be largely satisfied with their governments and ways of life, while still holding
  some degree of distrust or discontent regarding their leaders. And both have a rural versus urban disparity
  that can cause tension and economic inequality among the population. An individual family or even a
  whole office full of people in one of the countries may look and act very similarly to families or offices
  in the other country.


  But what is different? In China, a far greater percentage of people may be involved in manufacturing
  than America. Many of China’s cities didn’t evolve from ports, transit centers, or river confluences
  hundreds of years ago, but are newly created urban centers inhabited by recent transplants from other
  locations. In the United States, citizens are generally free to express dissatisfaction with their government
  through public protest, advocacy, and online platforms. In contrast, in China, platforms such as X (formerly
  Twitter), Facebook, and YouTube are blocked, and news media operate under significant government regulation
  and oversight.


  Sociologist Gerhard Lenski Jr. (1924–2015) defined societies in terms of their technological sophistication.
  As a society advances, so does its use of technology. Societies with rudimentary technology depend on
  the fluctuations of their environments, while industrialized societies have more control over the impact
  of their surroundings and thus develop different cultural features. This distinction is so important
  that sociologists generally classify societies along a spectrum of their level of industrialization—from
  preindustrial to industrial to postindustrial.'
