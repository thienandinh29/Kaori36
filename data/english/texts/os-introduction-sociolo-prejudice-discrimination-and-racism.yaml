text: 'It is important to learn about stereotypes before discussing the terms prejudice, discrimination,
  and racism that are often used interchangeably in everyday conversation. Stereotypes are oversimplified
  generalizations about groups of people. Stereotypes can be based on race, ethnicity, age, gender, sexual
  orientation—almost any characteristic. They may be positive (usually about one’s own group) but are
  often negative (usually toward other groups, such as when members of a dominant racial group suggest
  that a subordinate racial group is stupid or lazy). In either case, the stereotype is a generalization
  that doesn’t take individual differences into account.


  Where do stereotypes come from? In fact, new stereotypes are rarely created; rather, they are recycled
  from subordinate groups that have assimilated into society and are reused to describe newly subordinate
  groups. For example, many stereotypes that are currently used to characterize new immigrants were used
  earlier in American history to characterize Irish and Eastern European immigrants.


  Prejudice refers to the beliefs, thoughts, feelings, and attitudes someone holds about a group. A prejudice
  is not based on personal experience; instead, it is a prejudgment, originating outside actual experience.
  Recall from the chapter on Crime and Deviance that the criminalization of marijuana was based on anti-immigrant
  sentiment; proponents used fictional, fear-instilling stories of "reefer madness" and rampant immoral
  and illegal activities among Spanish-speaking people to justify new laws and harsh treatment of marijuana
  users. Many people who supported criminalizing marijuana had never met any of the new immigrants who
  were rumored to use it; the ideas were based in prejudice.


  While prejudice is based in beliefs outside of experience, experience can lead people to feel that their
  prejudice is confirmed or justified. This is a type of confirmation bias. For example, if someone is
  taught to believe that a certain ethnic group has negative attributes, every negative act committed
  someone in that group can be seen as confirming the prejudice. Even a minor social offense committed
  by a member of the ethnic group, like crossing the street outside the crosswalk or talking too loudly
  on a bus, could confirm the prejudice.


  While prejudice often originates outside experience, it isn''t instinctive. Prejudice—as well as the
  stereotypes that lead to it and the discrimination that stems from it—is most often taught and learned.
  The teaching arrives in many forms, from direct instruction or indoctrination, to observation and socialization.
  Movies, books, charismatic speakers, and even a desire to impress others can all support the development
  of prejudices.


  While prejudice refers to biased thinking, discrimination consists of actions against a group of people.
  Discrimination can be based on race, ethnicity, age, religion, health, and other categories. For example,
  discrimination based on race or ethnicity can take many forms, from unfair housing practices such as
  redlining to biased hiring systems. Overt discrimination has long been part of U.S. history. In the
  late nineteenth century, it was not uncommon for business owners to hang signs that read, "Help Wanted:
  No Irish Need Apply." And southern Jim Crow laws, with their "Whites Only" signs, exemplified overt
  discrimination that is not tolerated today.


  Discrimination also manifests in different ways. The scenarios above are examples of individual discrimination,
  but other types exist. Institutional discrimination occurs when a societal system has developed with
  embedded disenfranchisement of a group, such as the U.S. military''s historical nonacceptance of minority
  sexualities (the "don''t ask, don''t tell" policy reflected this norm).


  While the form and severity of discrimination vary significantly, they are considered forms of oppression.
  Institutional discrimination can also include the promotion of a group''s status, such as in the case
  of privilege, which describes the benefits people receive simply by being part of the dominant group.


  Most people have some level of privilege, whether it has to do with health, ability, race, or gender.
  When discussing race, the focus is often on White privilege, which is the societal privilege that benefits
  White people, or those perceived to be White, over non-White people in some societies, including the
  United States. Most White people are willing to admit that non-White people live with a set of disadvantages
  due to the color of their skin. But until they gain a good degree of self-awareness, few people are
  willing to acknowledge the benefits they themselves receive by being a part of the dominant group. Why
  not? Some may feel it lessens their accomplishments, others may feel a degree of guilt, and still others
  may feel that admitting to privilege makes them seem like a bad or mean person. But White (or other
  dominant) privilege is an institutional condition, not a personal one. It exists whether the person
  asks for it or not. In fact, a pioneering thinker on the topic, Peggy McIntosh, noted that she didn''t
  recognize privilege because, in fact, it was not based in meanness. Instead, it was an "invisible weightless
  knapsack full of special provisions" that she didn''t ask for, yet from which she still benefitted.
  As the reference indicates, McIntosh''s first major publication about White privilege was released in
  1989; many people have only become familiar with the term in recent years.'
