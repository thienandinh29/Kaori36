text: 'The arrival of the Spanish at the end of the fifteenth century inaugurated a new age in the Americas,
  but in Mexico and Peru, the Spanish entered areas already under the control of large and sophisticated
  empires. The Inca in the Andes and the Aztecs in Mesoamerica were the cultural inheritors of thousands
  of years of civilizational development that included the heritage of the Moche, Nazca, and Tiwanaku
  in the Andes and the Olmec, Maya, and Teotihuacanos in Mesoamerica. Likewise, the Mississippian tradition
  chiefdoms of the Eastern Woodlands, where the early Spanish explorers also trod, were the product of
  ancient cultural and civilization developments going back to the mound-building traditions of Adena,
  Hopewell, and even earlier cultures.


  At around the same time the Aztec Empire was expanding across Mesoamerica, an equally impressive new
  civilization was on the rise in the Andes region of South America. Known today as the Inca, its cultural
  and technological roots extend back to the earlier Andean cultures of the Moche, Nazca, and Tiwanaku.
  The heart of what became the Inca Empire was the city of Cuzco, located more than eleven thousand feet
  above sea level in the central Andes and northwest of the shores of Lake Titicaca. But centuries before
  it became an imperial city, it was a relatively modest agricultural community where the predecessors
  of the Inca farmed potatoes and maize and raised llamas and guanacos.


  According to one Andean tradition, the origin story of the Inca began with a great flood that displaced
  four brothers and their wives and sent them on a mission to find fertile land where they could settle.
  During the journey, one of the brothers acquired incredible and supernatural strength. Consumed with
  jealousy, the other brothers sealed him in a cave and left him to die. They continued on, somewhat remorseful,
  but on the outskirts of Cuzco, two were mysteriously turned to stone. This left only one brother, Ayar
  Manco, who reached Cuzco, dipped his golden cane into the ground, and founded the city.


  The fantastical story of the Ayar brothers, with its descriptions of magic and supernatural events,
  is clearly partly fictional, and it is not the only origin myth about the Inca. However, it may preserve
  a kernel of truth about the early group that founded Cuzco, perhaps after some type of migration prompted
  by changes in climate. We may never fully know, but based on historical and archaeological evidence,
  we do know the people of Cuzco emerged as agricultural villagers by around 1000. Through both peaceful
  and violent means, they assumed a dominant position in the larger surrounding region. Over time, their
  numbers grew, and they became one of a number of small military powers in the Andean region, centered
  on the growing city of Cuzco. As master stonemasons, the Inca were capable of carefully carving stones
  so they fit tightly together. At its height in the early sixteenth century, Cuzco was an impressive
  stone city built high in the Andes.


  The leap to imperial expansion is explained by another Inca legend, this time telling of a military
  challenge from a rival group known as the Chanka and involving real historical figures. When the Chanka
  arrived at Cuzco, King Wiraqocha fled the city with his heir, leaving only a small group of nobles aligned
  with another son, Yupanki, to stand their ground. The defenders’ act of courage inspired the creator
  god of the Inca to intervene by transforming the surrounding stones into warriors who helped Yupanki
  defeat the Chanka. In the aftermath of the victory, the story goes on, Yupanki assumed the additional
  title of Pachacuti, meaning “cataclysm.” But the victory also led to an internal dispute between Pachacuti
  Yupanki and the reigning king, his father. This was ultimately resolved in Pachacuti Yupanki’s favor,
  and he assumed control of Cuzco and the Inca, whereupon he began a series of wars of expansion that
  gave birth to the Inca Empire.


  While this story was partly contrived, there is no doubt that Inca expansion did occur, and Pachacuti
  appears to have been a real leader. The empire’s growth began in earnest around 1430 during his reign,
  and as king he oversaw the conquest of much of modern Peru. His successors, Thumpa and Wayna Qhapaq,
  further expanded the empire by adding territory far to the south in today’s Chile and Argentina, to
  the east in the edges of the Amazon basin, and to the north in Ecuador and Colombia. These wars were
  costly in lives and material, but they were also important for sharpening the skills of the Inca military.


  Inca warriors wore helmets and cloth armor, carried shields, and were equipped with weapons like clubs,
  spears, slings, and axes. Typically, they could use their great numbers to overwhelm and awe the enemy
  into capitulation. If that failed, they rushed into the fray, often with little discipline but with
  great courageous resolve. Apart from the sheer power of numbers, the Inca military excelled in its ability
  to move swiftly along the empire’s complicated highland road systems to surprise the enemy and put down
  any emerging rebellions.'
