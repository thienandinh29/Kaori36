text: 'Technology and the media are interwoven, and neither can be separated from contemporary society
  in most core and semi-peripheral nations. Media is a term that refers to all print, digital, and electronic
  means of communication. From the time the printing press was created (and even before), technology has
  influenced how and where information is shared. Today, it is impossible to discuss media and the ways
  societies communicate without addressing the fast-moving pace of technology change. Twenty years ago,
  if you wanted to share news of your baby’s birth or a job promotion, you phoned or wrote letters. You
  might tell a handful of people, but you probably wouldn’t call up several hundred, including your old
  high school chemistry teacher, to let them know. Now, you might join an online community of parents-to-be
  even before you announce your pregnancy via a staged Instagram picture. The circle of communication
  is wider than ever, and when we talk about how societies engage with technology, we must take media
  into account, and vice versa.


  Technology creates media. The comic book you bought your daughter is a form of media, as is the movie
  you streamed for family night, the web site you used to order takeout, the billboard you passed on the
  way to pick up your food, and the newspaper you read while you were waiting for it. Without technology,
  media would not exist, but remember, technology is more than just the media we are exposed to.


  Media and technology have evolved hand in hand, from early print to modern publications, from radio
  to television to film. New media emerge constantly, such as we see in the online world.


  New media encompasses all interactive forms of information exchange. These include social networking
  sites, blogs, podcasts, wikis, and virtual worlds. Many are not "new" in the sense that they were developed
  in the past few years (some may be older than you), but they are newer than the media mentioned above,
  and they rely on types of technologies that were not available until about thirty years ago. Many are
  ways disruptive to traditional media or to companies that rely on those other formats. Clearly, the
  list of new media grows almost daily, and you might feel we are missing some. In fact, the immediacy
  of new media coupled with the lack of oversight means we must be more careful than ever to ensure that
  we are making good decisions about the accuracy, ethics, and cultural responsiveness of these formats.


  Chances are your mobile phone company, as well as the makers of your laptop and your household appliances,
  are all counting on their products to fail. Not too quickly, of course, or consumers wouldn''t stand
  for it—but frequently enough that you might find that it costs far more to fix a device than to replace
  it with a newer model. Or you find the phone company e-mails you saying that you’re eligible for a free
  new phone, because yours is a whopping two years old. And appliance repair people say that while they
  might be fixing some machines that are twenty years old, they generally aren’t fixing those that are
  seven years old; newer models are built to be thrown out. This strategy is called planned obsolescence,
  and it is the business practice of planning for a product to be obsolete or unusable from the time it
  is created.


  To some extent, planned obsolescence is a natural extension of new and emerging technologies. After
  all, who is going to cling to an enormous and slow desktop computer from 2000 when a few hundred dollars
  can buy one that is significantly faster and better? But the practice is not always so benign. The classic
  example of planned obsolescence is the nylon stocking. Women’s stockings—once an everyday staple of
  women’s lives––get “runs” or “ladders” after only a few wearings. This requires the stockings to be
  discarded and new ones purchased. Not surprisingly, the garment industry did not invest heavily in finding
  a rip-proof fabric; it was in manufacturers'' best interest that their product be regularly replaced.


  Those who use Microsoft Windows might feel that like the women who purchased endless pairs of stockings,
  they are victims of planned obsolescence. Every time Windows releases a new operating system, there
  are typically not many innovations in it that consumers feel they must have. However, the software programs
  are upwardly compatible only. This means that while the new versions can read older files, the old version
  cannot read the newer ones. In short order, those who have not upgraded right away find themselves unable
  to open files sent by colleagues or friends, and they usually wind up upgrading as well.'
