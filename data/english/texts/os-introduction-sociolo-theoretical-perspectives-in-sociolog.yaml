text: 'One criticism of the structural-functional theory is that it can’t adequately explain social change
  even though the functions are processes. Also problematic is the somewhat circular nature of this theory:
  repetitive behavior patterns are assumed to have a function, yet we profess to know that they have a
  function only because they are repeated. Furthermore, dysfunctions may continue, even though they don’t
  serve a function, which seemingly contradicts the basic premise of the theory. Many sociologists now
  believe that functionalism is no longer useful as a macro-level theory, but that it does serve a useful
  purpose in some mid-level analyses.


  Sociologists around the world look closely for signs of what would be an unprecedented event: the emergence
  of a global culture. In the past, empires such as those that existed in China, Europe, Africa, and Central
  and South America linked people from many different countries, but those people rarely became part of
  a common culture. They lived too far from each other, spoke different languages, practiced different
  religions, and traded few goods. Today, increases in communication, travel, and trade have made the
  world a much smaller place. More and more people are able to communicate with each other instantly—wherever
  they are located—by telephone, video, and text. They share movies, television shows, music, games, and
  information over the Internet. Students can study with teachers and pupils from the other side of the
  globe. Governments find it harder to hide conditions inside their countries from the rest of the world.


  Sociologists research many different aspects of this potential global culture. Some explore the dynamics
  involved in the social interactions of global online communities, such as when members feel a closer
  kinship to other group members than to people residing in their own countries. Other sociologists study
  the impact this growing international culture has on smaller, less-powerful local cultures. Yet other
  researchers explore how international markets and the outsourcing of labor impact social inequalities.
  Sociology can play a key role in people’s abilities to understand the nature of this emerging global
  culture and how to respond to it.'
