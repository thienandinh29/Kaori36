text: 'Many elements of early Roman culture and society resulted from Greek influence on the Italian peninsula.
  Later, when the Roman state expanded and built an empire, its people transmitted their culture—heavily
  indebted to Ancient Greece—to the Celtic and Germanic tribes of central and western Europe. They also
  transmitted their language, which is why French, Portuguese, Italian, and Spanish are known as “Romance”
  languages: They are descended from the Latin language spoken by the Romans. The classical civilizations
  of Ancient Greece and Rome were therefore the foundation for what became known as Western civilization.


  Rome’s constant wars and conquests in the third and second centuries BCE created a host of social, economic,
  and political problems for the republic. The Roman people grew dissatisfied with the leadership of the
  Senate and the aristocratic elite, and they increasingly looked to strong military leaders to address
  the problems.


  A number of factors contributed to these problems and transformations. From the foundation of the republic,
  most Roman citizens had owned and operated small family farms. Indeed, to serve as Roman soldiers, men
  had to own property. However, the Punic Wars had strained this traditional system. Roman soldiers were
  often away from home for long periods of time, leaving the women and children to maintain their holdings.
  When they ultimately did return, many found their property in another’s hands. Others decided to sell
  their neglected farms and move their families to the expanding city of Rome, where they joined the growing
  ranks of the landless working class known as the proletariat. By the first century BCE, the population
  of the city of Rome may have exceeded one million.


  The growth of the proletariat disrupted the Roman political system and invited large-scale corruption.
  The traditional patron-client system collapsed, since landless Romans didn’t need the assistance of
  patrons to settle property disputes. Politicians therefore had to win the support of the urban masses
  with free food and entertainment, such as gladiatorial combats, and promises to create jobs through
  public works projects. Some even organized the poor into violent gangs to frighten their political rivals.
  These conditions resulted in widespread dissatisfaction with the government of the republic.


  To meet the growing demand for grain, wine, and olive oil to feed the urban population, large landowners
  bought land from poor Roman farmers and leased public land from the Roman state to create large plantations.
  These were very profitable because landowners could cheaply purchase enslaved people, who were plentiful.
  For example, after the defeat of Perseus of Macedon in 168 BCE, the Romans enslaved 150,000 people from
  Epirus as punishment since this kingdom had been allied with Perseus in the war. Pirates from Cilicia
  (in southeast Turkey) and from the Greek island of Crete also kidnapped people throughout the eastern
  Mediterranean and sold them to Roman traders. The island of Delos in the Aegean Sea became a massive
  human market in the second century BCE, where reportedly ten thousand people were bought and sold every
  day.


  Terrible working conditions resulted in massive revolts by the enslaved, beginning in the second half
  of the second century BCE. The most famous was led by Spartacus, an enslaved man and gladiator from
  Thrace (modern Bulgaria). In 76 BCE, Spartacus and other enslaved gladiators rose against their owners
  and were quickly joined by hundreds of thousands of others. Spartacus’s forces defeated two Roman armies
  before being crushed in 71 BCE. The Romans crucified thousands of the rebels along Italy’s major roads
  to send a warning to enslaved people across Italy.


  In addition to the proletariat and enslaved people, new classes of wealthy Romans were also unhappy
  with the leadership of the traditional elite. The most profitable enterprise for these new Roman entrepreneurs
  was acting as bankers and public contractors, or publicans. The republic relied on publicans to construct
  public works such as aqueducts and theaters, as well as to operate government-owned mines and collect
  taxes. Roman governors often looked the other way when publicans squeezed additional tax revenues from
  the populations of the provinces.


  This tumultuous and complicated environment led to the rise of two of the Late Republic’s most intriguing
  political figures, Tiberius and Gaius Gracchus. The Gracchi, as they are collectively known, were plebeian
  brothers whose families had been members of the elite for generations (Scipio Africanus was their grandfather).
  Tiberius, the elder brother, was concerned to see the large plantations being worked by enslaved foreigners
  rather than Roman farmers. He feared Rome’s military was in danger since Rome relied on its land-owning
  farmers to equip themselves and serve in the army. In 133 BCE, as a tribune, he proposed a law to distribute
  public land to landless Romans. This measure struck a blow at the senatorial class, many of whom had
  accumulated huge swaths of land formerly owned by independent farmers who had gone to war. The assembly
  voted to approve the proposal, but many senators were horrified not only because they stood to lose
  land but also because, to win the vote, Tiberius had violated the traditions of the Republic. The Republic
  was ruled by the upper classes, and in courting popular opinion, the brothers had challenged elite control
  over high political institutions. Convinced he was assuming too much popular support and violating the
  traditions of Rome, the Senate declared a state of emergency and a group of senators beat Tiberius to
  death.'
