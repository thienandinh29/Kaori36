text: 'Deviance is a more encompassing term than crime, meaning that it includes a range of activities,
  some of which are crimes and some of which are not. Sociologists may study both with equal interest,
  but, as a whole, society views crime as far more significant. Crime preoccupies several levels of government,
  and it drives concerns among families and communities.


  Deviance may be considered relative: Behaviors may be considered deviant based mostly on the circumstances
  in which they occurred; those circumstances may drive the perception of deviance more than the behavior
  itself. Relatively minor acts of deviance can have long-term impacts on the person and the people around
  them. For example, if an adult, who should “know better,” spoke loudly or told jokes at a funeral, they
  may be chastised and forever marked as disrespectful or unusual. But in many cultures, funerals are
  followed by social gatherings – some taking on a party-like atmosphere – so those same jovial behaviors
  would be perfectly acceptable, and even encouraged, just an hour later.


  Consider the example of marijuana legalization mentioned earlier. Why was marijuana illegal in the first
  place? In fact, it wasn’t. Humans have used cannabis openly in their societies for thousands of years.
  While it was not a widely used substance in the United States, it had been accepted as a medicinal and
  recreational option, and was neither prohibited nor significantly regulated until the early 1900s. What
  changed?


  In the early 1900s, an influx of immigrants began entering the country from Mexico. These newcomers
  took up residence in White communities, spoke a different language, and began competing for jobs and
  resources. They used marijuana more frequently than most Americans. Police and others began to circulate
  rumors regarding the substance’s link to violence and immorality. Newspapers and lawmakers spoke about
  the “Marijuana Menace” and the “evil weed,” and articles and images began to portray it as a corrupting
  force on America’s youth. Beginning in 1916, state after state began passing laws prohibiting marijuana
  use, and in 1937 Congress passed a federal law banning it. Penalties for its usage increased over time,
  spiking during the War on Drugs, with racially and ethnically disparate applications. But more recently,
  as discussed in the introduction, marijuana is once again seen as an important medical treatment and
  an acceptable recreational pursuit. What changed this time?


  Perceptions and proclamations of deviance have long been a means to oppress people by labeling their
  private behavior as criminal. Until the 1970s and 1980s, same-sex acts were prohibited by state laws.
  It was illegal to be gay or lesbian, and the restrictions extended to simple displays like holding hands.
  Other laws prohibited clothing deemed “inappropriate” for one’s biological sex. As a result, military
  service members and even war veterans were dishonorably discharged (losing all benefits) if they were
  discovered to be gay. Police harassed and humiliated LGBTQ people and regularly raided gay bars. And
  anti-LGBTQ street violence or hate crimes were tacitly permitted because they were rarely prosecuted
  and often lightly punished. While most states had eliminated their anti-LGBTQ laws by the time the Supreme
  Court struck them down in 2003, 14 states still had some version of them on the books.


  To further explore the relativity of deviance and its relationship to perceptions of crime, consider
  gambling. Excessive or high-risk gambling is usually seen as deviant, but more moderate gambling is
  generally accepted. Still, gambling was for a long time prohibited in most of the United States, making
  it a crime to participate in certain types of gambling or to do so outside of specified locations. Even
  as laws loosened, a state for example may allow betting on horse races but not on sports. Changes to
  these laws occurred, especially due to the rise of online gambling via poker sites and sports betting.
  But for decades, a generally non-deviant behavior was made criminal: When otherwise law-abiding people
  decided to engage in low-stakes and non-excessive gambling, they were breaking the law. Sociologists
  may study the essential question arising from this situation: Were these gamblers being deviant by breaking
  the law, even when the actual behavior at hand was not generally considered deviant?


  When a person violates a social norm, what happens? A driver caught speeding can receive a speeding
  ticket. A student who wears a bathrobe to class gets a warning from a professor. An adult belching loudly
  is avoided. All societies practice social control, the regulation and enforcement of norms. The underlying
  goal of social control is to maintain social order, an arrangement of practices and behaviors on which
  society’s members base their daily lives. Think of social order as an employee handbook and social control
  as a manager. When a worker violates a workplace guideline, the manager steps in to enforce the rules;
  when an employee is doing an exceptionally good job at following the rules, the manager may praise or
  promote the employee.


  The means of enforcing rules are known as sanctions. Sanctions can be positive as well as negative.
  Positive sanctions are rewards given for conforming to norms. A promotion at work is a positive sanction
  for working hard. Negative sanctions are punishments for violating norms. Being arrested is a punishment
  for shoplifting. Both types of sanctions play a role in social control.'
