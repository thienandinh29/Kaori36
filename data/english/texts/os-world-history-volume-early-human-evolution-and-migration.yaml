text: 'Millions of years ago, our distant ancestors descended from the trees, took to walking upright
  on the land, and gradually evolved into the species we are today. Their evolution was influenced by
  many variables, including changes in climate, diet, and survival strategies. Over time, humans developed
  new skills and tools to meet the challenges of endurance and sought better prospects for themselves
  through cooperation and migration.


  Understanding these changes and the long-ago origins of our species has required careful research by
  archaeologists, anthropologists, genetic scientists, historians, sociologists, and many others. Through
  painstaking reconstructions and study, these specialists have used a relatively small number of archaeological
  finds and material remnants of our distant ancestors to paint a striking picture of our prehistoric
  past, going back millions of years. The nature of this work, however, requires using some extrapolation,
  educated speculation, and outright guesswork to piece together the bits of unearthed evidence into an
  intelligible story. This means that even as we have had to discard old theories when new information
  has emerged, there remain plenty of things we’ll simply never know for sure.'
