text: 'When filling out a document such as a job application or school registration form, you are often
  asked to provide your name, address, phone number, birth date, and sex or gender. But have you ever
  been asked to provide your sex and your gender? Like most people, you may not have realized that sex
  and gender are not the same. However, sociologists and most other social scientists view them as conceptually
  distinct. Sex refers to physical or physiological differences between males and females, including both
  primary sex characteristics (the reproductive system) and secondary characteristics such as height and
  muscularity. Gender refers to behaviors, personal traits, and social positions that society attributes
  to being female or male.


  A person’s sex, as determined by their biology, does not always correspond with their gender. Therefore,
  the terms sex and gender are not interchangeable. A baby who is born with male genitalia will most likely
  be identified as male. As a child or adult, however, they may identify with the feminine aspects of
  culture. Since the term sex refers to biological or physical distinctions, characteristics of sex will
  not vary significantly between different human societies. Generally, persons of the female sex, regardless
  of culture, will eventually menstruate and develop breasts that can lactate. Characteristics of gender,
  on the other hand, may vary greatly between different societies. For example, in U.S. culture, it is
  considered feminine (or a trait of the female gender) to wear a dress or skirt. However, in many Middle
  Eastern, Asian, and African cultures, sarongs, robes, or gowns are considered masculine. The kilt worn
  by a Scottish man does not make him appear feminine in that culture.


  The dichotomous or binary view of gender (the notion that someone is either male or female) is specific
  to certain cultures and is not universal. In some cultures gender is viewed as fluid. In the past, some
  anthropologists used the term berdache to refer to individuals who occasionally or permanently dressed
  and lived as a different gender. The practice has been noted among certain Native American tribes. Samoan
  culture accepts what Samoans refer to as a “third gender.” Fa’afafine, which translates as “the way
  of the woman,” is a term used to describe individuals who are born biologically male but embody both
  masculine and feminine traits. Fa’afafines are considered an important part of Samoan culture. Individuals
  from other cultures may mislabel their sexuality because fa’afafines have a varied sexual life that
  may include men and women.


  The Legalese of Sex and Gender: The terms sex and gender have not always been differentiated in the
  English language. It was not until the 1950s that U.S. and British psychologists and other professionals
  formally began distinguishing between sex and gender. Since then, professionals have increasingly used
  the term gender. By the end of the twenty-first century, expanding the proper usage of the term gender
  to everyday language became more challenging—particularly where legal language is concerned. In an effort
  to clarify usage of the terms sex and gender, U.S. Supreme Court Justice Antonin Scalia wrote in a 1994
  briefing, “The word gender has acquired the new and useful connotation of cultural or attitudinal characteristics
  (as opposed to physical characteristics) distinctive to the sexes. That is to say, gender is to sex
  as feminine is to female and masculine is to male” (J.E.B. v. Alabama, 144 S. Ct. 1436 [1994]). Supreme
  Court Justice Ruth Bader Ginsburg had a different take, however. She freely swapped them in her briefings
  so as to avoid having the word “sex” pop up too often. Ginsburg decided on this approach earlier in
  her career while she was arguing before the Supreme Court; her Columbia Law School secretary suggested
  it to Ginsburg, saying that when “those nine men” (the Supreme Court justices), “hear that word and
  their first association is not the way you want them to be thinking”.


  More recently, the word “sex” was a key element of the landmark Supreme Court case affirming that the
  Civil Rights Act''s workplace protections applied to LGBTQ people. Throughout the case documents and
  discussions, the term and its meanings are discussed extensively. In his decision statement, Justice
  Neil Gorsuch wrote, “It is impossible to discriminate against a person for being homosexual or transgender
  without discriminating ... based on sex”. Dissenting justices and commentators felt that Gorsuch and
  the other justices in the majority were recalibrating the original usage of the term. The arguments
  about the language itself, which occupy much of the Court''s writings on the matter, are further evidence
  of the evolving nature of the words, as well as their significance.'
