text: 'As human beings grow older, they go through different phases or stages of life. It is helpful to
  understand aging in the context of these phases. A life course is the period from birth to death, including
  a sequence of predictable life events such as physical maturation. Each phase comes with different responsibilities
  and expectations, which of course vary by individual and culture. Children love to play and learn, looking
  forward to becoming preteens. As preteens begin to test their independence, they are eager to become
  teenagers. Teenagers anticipate the promises and challenges of adulthood. Adults become focused on creating
  families, building careers, and experiencing the world as independent people. Finally, many adults look
  forward to old age as a wonderful time to enjoy life without as much pressure from work and family life.
  In old age, grandparenthood can provide many of the joys of parenthood without all the hard work that
  parenthood entails. And as work responsibilities abate, old age may be a time to explore hobbies and
  activities that there was no time for earlier in life. But for other people, old age is not a phase
  that they look forward to. Some people fear old age and do anything to “avoid” it by seeking medical
  and cosmetic fixes for the natural effects of age. These differing views on the life course are the
  result of the cultural values and norms into which people are socialized, but in most cultures, age
  is a master status influencing self-concept, as well as social roles and interactions.


  Through the phases of the life course, dependence and independence levels change. At birth, newborns
  are dependent on caregivers for everything. As babies become toddlers and toddlers become adolescents
  and then teenagers, they assert their independence more and more. Gradually, children come to be considered
  adults, responsible for their own lives, although the point at which this occurs is widely varied among
  individuals, families, and cultures.


  As Riley (1978) notes, aging is a lifelong process and entails maturation and change on physical, psychological,
  and social levels. Age, much like race, class, and gender, is a hierarchy in which some categories are
  more highly valued than others. For example, while many children look forward to gaining independence,
  Packer and Chasteen (2006) suggest that even in children, age prejudice leads to a negative view of
  aging. This, in turn, can lead to a widespread segregation between the old and the young at the institutional,
  societal, and cultural levels.


  Nascher refused to accept this dismissive view, seeing it as medical neglect. He believed it was a doctor’s
  duty to prolong life and relieve suffering whenever possible. In 1914, he published his views in his
  book Geriatrics: The Diseases of Old Age and Their Treatment. Nascher saw the practice of caring for
  the elderly as separate from the practice of caring for the young, just as pediatrics (caring for children)
  is different from caring for grown adults.


  Nascher had high hopes for his pioneering work. He wanted to treat the aging, especially those who were
  poor and had no one to care for them. Many of the elderly poor were sent to live in “almshouses,” or
  public old-age homes. Conditions were often terrible in these almshouses, where the aging were often
  sent and just forgotten.


  As hard as it might be to believe today, Nascher’s approach was once considered unique. At the time
  of his death, in 1944, he was disappointed that the field of geriatrics had not made greater strides.
  In what ways are the elderly better off today than they were before Nascher’s ideas gained acceptance?'
