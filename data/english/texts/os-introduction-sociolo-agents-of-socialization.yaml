text: 'Socialization helps people learn to function successfully in their social worlds. How does the
  process of socialization occur? How do we learn to use the objects of our society’s material culture?
  How do we come to adopt the beliefs, values, and norms that represent its nonmaterial culture? This
  learning takes place through interaction with various agents of socialization, like peer groups and
  families, plus both formal and informal social institutions.


  Social groups often provide the first experiences of socialization. Families, and later peer groups,
  communicate expectations and reinforce norms. People first learn to use the tangible objects of material
  culture in these settings, as well as being introduced to the beliefs and values of society.


  A peer group is made up of people who are similar in age and social status and who share interests.
  Peer group socialization begins in the earliest years, such as when kids on a playground teach younger
  children the norms about taking turns, the rules of a game, or how to shoot a basket. As children grow
  into teenagers, this process continues. Peer groups are important to adolescents in a new way, as they
  begin to develop an identity separate from their parents and exert independence. Additionally, peer
  groups provide their own opportunities for socialization since kids usually engage in different types
  of activities with their peers than they do with their families. Peer groups provide adolescents’ first
  major socialization experience outside the realm of their families. Interestingly, studies have shown
  that although friendships rank high in adolescents’ priorities, this is balanced by parental influence.


  The social institutions of our culture also inform our socialization. Formal institutions—like schools,
  workplaces, and the government—teach people how to behave in and navigate these systems. Other institutions,
  like the media, contribute to socialization by inundating us with messages about norms and expectations.


  While some religions are informal institutions, here we focus on practices followed by formal institutions.
  Religion is an important avenue of socialization for many people. The United States is full of synagogues,
  temples, churches, mosques, and similar religious communities where people gather to worship and learn.
  Like other institutions, these places teach participants how to interact with the religion’s material
  culture (like a mezuzah, a prayer rug, or a communion wafer). For some people, important ceremonies
  related to family structure—like marriage and birth—are connected to religious celebrations. Many religious
  institutions also uphold gender norms and contribute to their enforcement through socialization. From
  ceremonial rites of passage that reinforce the family unit to power dynamics that reinforce gender roles,
  organized religion fosters a shared set of socialized values that are passed on through society.


  Although we do not think about it, many of the rites of passage people go through today are based on
  age norms established by the government. To be defined as an “adult” usually means being eighteen years
  old, the age at which a person becomes legally responsible for him- or herself. And sixty-five years
  old is the start of “old age” since most people become eligible for senior benefits at that point.


  Each time we embark on one of these new categories—senior, adult, taxpayer—we must be socialized into
  our new role. Seniors must learn the ropes of Medicare, Social Security benefits, and senior shopping
  discounts. When U.S. males turn eighteen, they must register with the Selective Service System within
  thirty days to be entered into a database for possible military service. These government dictates mark
  the points at which we require socialization into a new category.


  Our direct interactions with social groups, like families and peers, teach us how others expect us to
  behave. Likewise, a society’s formal and informal institutions socialize its population. Schools, workplaces,
  and the media communicate and reinforce cultural norms and values.


