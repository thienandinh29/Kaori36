text: 'The Eurasian Steppe is a vast stretch of grassland running from Eastern Europe over the top of
  central Asia and China into Mongolia. For much of human history, the area was home to traveling bands
  of nomadic pastoralists who grazed herds and collided with settled agricultural societies in Persia,
  Russia, and China. Geographers divide the Eurasian Steppe into two zones: One is in the west near Ukraine,
  Russia, and Kazakhstan, and the other is in the east, close to China and Mongolia. In both areas, the
  vastness of the land supported large herds of goat, cattle, and sheep. The prevalence of horses enabled
  powerful warriors of many cultures to rule from the saddle but also gave their people the freedom to
  roam, migrate, and resist absorption into a large unified state. While much of their history is still
  debated, these various tribes of the steppes provided the origins for a great number of Turkic, Iranian,
  Mongolic, Uralic, Tibeto-Burman, and multiethnic peoples today.


  The earliest written records about many non-Chinese people living along the steppes come from Chinese
  sources, which referred to these people collectively as the Hu (or Donghu) and divided them into five
  large groups. These were the Xiongnu, the Di, the Qiang, the Xianbei, and the Jie. Later inhabitants
  of the steppes in the ancient world included the Khitan and many smaller groups.


  Among the more powerful confederations noted by Chinese scribes were the Xiongnu, who controlled the
  lands near Mongolia from the third to the first century BCE. The Xiongnu became the dominant military
  confederation after forcing their rivals the Yuezhi to migrate west. In many periods, the relationship
  between the Xiongnu and Chinese dynasties such as the Han was complicated. Sometimes the Xiongnu and
  the Chinese were natural trading partners, exchanging horses for grain and silk. Access to Chinese civilization
  normally demanded that the Xiongnu submit tribute, accepting inferior status in return for trade rights
  and other rewards such as Chinese brides to establish stronger ties between the two cultures. At other
  times, the Xiongnu preferred to assert military and cultural dominance by raiding China and inciting
  war as well as constructing defenses such as the many northern fortification walls built by successive
  dynasties. At several points in their history, the Xiongnu were strong enough militarily to force the
  Chinese to adopt a policy of appeasement, exacting huge sums of silk, rice, and cash for peace. As a
  result, the tribute flowing between Xiongnu and Han Chinese often became a bribe meant to appease the
  nomadic tribes.


  Simultaneously, tribal chieftains could often be employed as vassals of the Chinese, acting as a buffer
  to protect their border with the steppes or to sow division and conflict between various other bands
  of the Xiongnu. Chinese officials and soldiers also often found it convenient to defect to the Xiongnu,
  marrying into powerful families who sought their skills and expertise as administrators. For all these
  reasons, the border between the steppes and China was fluid and constantly changing, even as Han historians
  began to refer to groups such as the Xiongnu as “barbarians” and the antithesis of what it meant to
  be Chinese. Conversely, the nomads and tribes of the steppes often looked on Chinese farmers as lowly,
  weak, and servile peoples, in contrast to their own identity and values.


  Critical to the struggle between the two were the Silk Roads. The balance of power, which initially
  favored the Xiongnu, shifted as two Han military expeditions went in search of allies in central Asia.
  These campaigns succeeded in subjugating the Xiongnu and gaining control over the eastern terminus of
  the Silk Roads. The Xiongnu were later weakened by years of civil war over their system of succession
  during the middle of the first century BCE. Less powerful groups in these wars tended to move toward
  the frontier of the Chinese empire and try to secure Chinese support against their rivals.


  Thus the Southern Xiongnu, with their homeland threatened by natural disasters and resource scarcity,
  became vassals of the Han fighting against the Northern Xiongnu. Acceptance of tributary status required
  sending an aristocratic prince as hostage to live in the Han capital and be given a classical Chinese
  education, part of the continued cultural exchange between the Inner Asian Steppe and China. Channels
  between the two cultures widened as the later Han moved settlers west and tried to create military colonies
  along the frontiers for defense, staffed by non-Chinese auxiliary forces. Hundreds of thousands of Xiongnu
  lived inside the borders of China’s empire, often becoming more settled and assimilated in their lifestyles
  and cultural practices.'
