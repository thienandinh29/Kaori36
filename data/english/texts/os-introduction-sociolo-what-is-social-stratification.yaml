text: 'Sociologists use the term social stratification to describe the system of social standing. Social
  stratification refers to a society’s categorization of its people into rankings based on factors like
  wealth, income, education, family background, and power.


  Geologists also use the word “stratification” to describe the distinct vertical layers found in rock.
  Typically, society’s layers, made of people, represent the uneven distribution of society’s resources.
  Society views the people with more resources as the top layer of the social structure of stratification.
  Other groups of people, with fewer and fewer resources, represent the lower layers. An individual’s
  place within this stratification is called socioeconomic status (SES).


  Most people and institutions in the United States indicate that they value equality, a belief that everyone
  has an equal chance at success. In other words, hard work and talent—not inherited wealth, prejudicial
  treatment, institutional racism, or societal values—determine social mobility. This emphasis on choice,
  motivation, and self-effort perpetuates the American belief that people control their own social standing.


  However, sociologists recognize social stratification as a society-wide system that makes inequalities
  apparent. While inequalities exist between individuals, sociologists are interested in larger social
  patterns. Sociologists look to see if individuals with similar backgrounds, group memberships, identities,
  and location in the country share the same social stratification. No individual, rich or poor, can be
  blamed for social inequalities, but instead all participate in a system where some rise and others fall.
  Most Americans believe the rising and falling is based on individual choices. But sociologists see how
  the structure of society affects a person''s social standing and therefore is created and supported
  by society.


  Factors that define stratification vary in different societies. In most societies, stratification is
  an economic system, based on wealth, the net value of money and assets a person has, and income, a person’s
  wages or investment dividends. While people are regularly categorized based on how rich or poor they
  are, other important factors influence social standing. For example, in some cultures, prestige is valued,
  and people who have them are revered more than those who don’t. In some cultures, the elderly are esteemed,
  while in others, the elderly are disparaged or overlooked. Societies’ cultural beliefs often reinforce
  stratification.


  One key determinant of social standing is our parents. Parents tend to pass their social position on
  to their children. People inherit not only social standing but also the cultural norms, values, and
  beliefs that accompany a certain lifestyle. They share these with a network of friends and family members
  that provide resources and support. This is one of the reasons first-generation college students do
  not fare as well as other students. They lack access to the resources and support commonly provided
  to those whose parents have gone to college.


  Other determinants are found in a society’s occupational structure. Teachers, for example, often have
  high levels of education but receive relatively low pay. Many believe that teaching is a noble profession,
  so teachers should do their jobs for love of their profession and the good of their students—not for
  money. Yet, the same attitude is not applied to professional athletes, executives, or those working
  in corporate world. Cultural attitudes and beliefs like these support and perpetuate social and economic
  inequalities.


  Sociologists distinguish between two types of systems of stratification. Closed systems accommodate
  little change in social position. They do not allow people to shift levels and do not permit social
  relationships between levels. Closed systems include estate, slavery, and caste systems. Open systems
  are based on achievement and allow for movement and interaction between layers and classes. How different
  systems operate reflect, emphasize, and foster specific cultural values, shaping individual beliefs.
  In this section, we’ll review class and caste stratification systems, plus discuss the ideal system
  of meritocracy.


  Caste systems are closed stratification systems where people can do little or nothing to change the
  social standing of their birth. The caste system determines all aspects of an individual’s life: occupations,
  marriage partners, and housing. Individual talents, interests, or potential do not provide opportunities
  to improve a person''s social position.


  In the Hindu caste tradition, people expect to work in an occupation and to enter into a marriage based
  on their caste. Accepting this social standing is considered a moral duty and people are socialized
  to accept their social standing. Cultural values reinforced the system. Caste systems promote beliefs
  in fate, destiny, and the will of a higher power, rather than promoting individual freedom as a value.
  This belief system is an ideology. Every culture has an ideology that supports its system of stratification.


  The caste system in India has been officially dismantled, but is still deeply embedded in Indian society,
  particularly in rural areas. In India’s larger cities, people now have more opportunities to choose
  their own career paths and marriage partners. As a global center of employment, corporations have introduced
  merit-based hiring and employment to the nation shifting the cultural expectations of the caste system.'
