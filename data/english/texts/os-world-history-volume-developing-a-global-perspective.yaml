text: 'From the legends of Troy heralded by Homer to the contents of digital archives accessed by modern
  students, the human story has fascinated and instructed those who have tried to understand its complexities.
  Knowing the past has long been considered a mark of civilization, and its study has never been more
  important. We have all heard the philosopher George Santayana’s observation, “Those who do not learn
  from history are doomed to repeat it.” Yet because history is an ever-changing collection of events
  influenced and shaped by a variety of causes and outcomes, it never truly repeats at all.


  Santayana’s comment rings true, however, in that we can discern patterns of human behavior by careful
  study of the past. To know history is to know ourselves, and understanding history’s nuances opens our
  imaginations to the possibilities each new situation creates. It is this knowledge of possibilities
  that allows the student of history to see the present with more clarity and prescience.'
