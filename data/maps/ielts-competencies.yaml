# Layer 2 of the two maps (specs/two-layer-map/spec.md): IELTS exam competencies, and the CEFR foundations that
# support each one. Checked by code (`python -m app.competencies.check`):
# - a link points at a foundation that exists: a grammar node of `english-ielts` (live), a node of the proposed path
#   (`specs/grammar-lessons/english-ielts-path.yaml`, accepted as "not live yet" and ignored by the engine until it
#   is), a pronunciation group of `english-pronunciation`, or a vocabulary band (vocab-a1 ... vocab-c1, vocab-nawl);
# - links never point at another competency (so there are no cycles);
# - every competency has at least one `requires` link.
# The links are Bronze ("đề xuất"): drafted by the agent, looked over by the owner (18 Nov 2026, "seem reasonable"),
# not yet checked by a teacher. A competency's estimate is never shown as an exam band until it is calibrated.
status: proposed
target:
  overall: 7.0  # the owner, 18 Nov 2026
  exam_date: 2027-07-01  # ASSUMED from SPEC's "summer 2027": the owner gave no date; change it here
balance:
  review_share_max: 0.34  # reviews at most about a third of the day's list (owner, 18 Nov 2026)
  foundations_in_a_row_max: 2  # owner, 18 Nov 2026
competencies:
  # Reading (evidence from CP4)
  - slug: reading-detail
    skill: reading
    name_vi: "Đọc: tìm thông tin chi tiết"
    name_en: "Reading: specific detail"
    links:
      - {node: vocab-b2, kind: requires}
      - {node: vocab-nawl, kind: helps}
